name: Supabase health

on:
  schedule:
    - cron: '23 2,10,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check published portfolio database access
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_PUBLISHABLE_KEY']
          if not base.startswith('https://') or not key:
              raise SystemExit('Configure repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY.')
          request = urllib.request.Request(
              base + '/rest/v1/portfolio_works?select=id&published=eq.true&limit=1',
              headers={'apikey': key},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              data = json.load(response)
              if response.status != 200 or not isinstance(data, list):
                  raise SystemExit('Unexpected Supabase response.')
          print('Supabase database responds correctly; no data was changed.')
          PY
