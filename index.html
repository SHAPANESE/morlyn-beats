<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070707" />
    <meta name="description" content="Morlyn Beats — Music production, mix and master, beats, guitar samples and 3D." />
    <title>Morlyn Beats — Music Producer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@800;900&family=DM+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="display.css" />
  </head>
  <body>
    <svg class="filter-definitions" aria-hidden="true">
      <defs>
        <filter id="barrel-distortion" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
          <feImage id="barrel-map" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map" />
          <feDisplacementMap id="barrel-displacement" in="SourceGraphic" in2="map" scale="110" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div class="crt-overlay" aria-hidden="true"></div>
    <div class="cursor" aria-hidden="true"></div>

    <main id="top">
      <section class="hero">
        <div class="simple-screen">
          <div class="screen-rgb" aria-hidden="true"></div>

          <div class="vhs-osd" aria-hidden="true">
            <div class="vhs-play is-playing">
              <span class="vhs-play-label">PLAY</span><span class="vhs-play-icon" aria-hidden="true">&#9654;</span>
            </div>
            <span class="vhs-speed" aria-hidden="true">SP</span>
            <span class="vhs-timecode" id="vhs-timecode">00:00:00</span>
          </div>

          <div class="hero-copy">
            <p class="eyebrow reveal">PRODUCTION SYSTEM / 01</p>
            <h1 class="hero-title warp-title" aria-label="Morlyn Beats">
              <span class="line"><span>MORLYN</span></span>
              <span class="line"><span>BEATS</span></span>
            </h1>
            <div class="hero-actions reveal">
              <a class="primary-action magnetic" href="https://instagram.com/morlyn.beats" target="_blank" rel="noreferrer">@MORLYN.BEATS <span>↗</span></a>
            </div>
          </div>

          <ul class="service-index" aria-label="Services">
            <li>MIX / MASTER</li>
            <li>BEATS</li>
            <li>GUITAR SAMPLES</li>
            <li>3D SHITS</li>
          </ul>

          <div class="three-stage" aria-label="Interactive 3D sampler">
            <canvas id="three-sampler"></canvas>
          </div>
          <p class="jp-mark" aria-hidden="true">モーリン<br />ビーツ</p>
        </div>
      </section>

      <div class="noise" aria-hidden="true"></div>

    </main>

    <canvas id="crt-output" aria-hidden="true"></canvas>

    <script src="script.js"></script>
    <script type="module" src="three-scene.js"></script>
    <script type="module" src="crt-pipeline.js"></script>
  </body>
</html>
